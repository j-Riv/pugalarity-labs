<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Fades the photo's left edge into the card background. -->
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="photo-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="630">
      <rect x="81" y="0" width="1119" height="630" fill="url(#fade)"/>
    </mask>
  </defs>
  <rect width="1200" height="630" fill="#14131a"/>
  <!-- Source art: src/assets/hero/hero.jpg (16:9), scaled to the card height and pinned right. -->
  <image href="../src/assets/hero/hero.jpg" x="81" y="0" width="1119" height="630" preserveAspectRatio="xMidYMid slice" mask="url(#photo-mask)"/>
  <rect x="0" y="606" width="1200" height="24" fill="#e8a863"/>

  <!-- Source art: src/assets/brand/pugalarity-labs-logo.png -->
  <image href="../src/assets/brand/pugalarity-labs-logo.png" x="68" y="44" width="330" height="95"/>

  <text x="72" y="294" font-family="Georgia, 'Times New Roman', serif" font-size="84" font-weight="600" fill="#f3ecdf">Aligning the</text>
  <text x="72" y="378" font-family="Georgia, 'Times New Roman', serif" font-size="84" font-weight="600" fill="#f3ecdf">future with</text>
  <text x="72" y="462" font-family="Georgia, 'Times New Roman', serif" font-size="84" font-weight="600" fill="#f3ecdf">snacks.</text>
  <text x="72" y="524" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#e8a863">Artificial Intelligence, Questionable Intelligence</text>
  <text x="72" y="572" font-family="ui-monospace, Menlo, monospace" font-size="22" fill="#b5aa98">pugalaritylabs.com</text>
</svg>
